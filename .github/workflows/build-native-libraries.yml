name: Build Native Libraries

on:
  workflow_call:
    inputs:
      libsql_ref:
        description: 'Exact libSQL release tag, commit, or ref to build'
        required: true
        type: string
      target_branch:
        description: 'Branch in this repository to update'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      libsql_ref:
        description: 'Exact libSQL release tag, commit, or ref to build. Release tags are preferred.'
        required: true
        type: string
      target_branch:
        description: 'Branch in this repository to update. Defaults to the selected workflow ref.'
        required: false
        default: ''
        type: string

jobs:
  build-native:
    outputs:
      commit_sha: ${{ steps.version_info.outputs.commit_sha }}
      tag_name: ${{ steps.version_info.outputs.tag_name }}
      cargo_version: ${{ steps.version_info.outputs.cargo_version }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            output: linux-x64
            ext: so
            elf_machine: Advanced Micro Devices X86-64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            output: linux-arm64
            ext: so
            elf_machine: AArch64
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            output: win-x64
            ext: dll
            is_cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            output: osx-arm64
            ext: dylib

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout libSQL
        uses: actions/checkout@v7
        with:
          repository: tursodatabase/libsql
          ref: ${{ inputs.libsql_ref }}
          path: libsql

      - name: Get libSQL version info
        id: version_info
        shell: bash
        run: |
          cd libsql

          commit_sha="$(git rev-parse HEAD)"
          echo "commit_sha=${commit_sha}" >> "$GITHUB_OUTPUT"

          tag_name="$(git describe --exact-match --tags HEAD 2>/dev/null || echo 'no-tag')"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

          cargo_version="$(perl -0ne 'if (/\[workspace\.package\].*?version\s*=\s*\"([^\"]+)\"/s) { print $1; exit }' Cargo.toml)"

          if [ -z "${cargo_version}" ] && [ -f libsql/Cargo.toml ]; then
            cargo_version="$(perl -0ne 'if (/\[package\].*?name\s*=\s*\"libsql\".*?version\s*=\s*\"([^\"]+)\"/s) { print $1; exit }' libsql/Cargo.toml)"
          fi

          if [ -z "${cargo_version}" ] && [ -f libsql-sys/Cargo.toml ]; then
            cargo_version="$(perl -0ne 'if (/\[package\].*?name\s*=\s*\"libsql-sys\".*?version\s*=\s*\"([^\"]+)\"/s) { print $1; exit }' libsql-sys/Cargo.toml)"
          fi

          if [ -z "${cargo_version}" ]; then
            echo "Unable to determine libSQL cargo version." >&2
            exit 1
          fi

          echo "cargo_version=${cargo_version}" >> "$GITHUB_OUTPUT"

      - name: Install MinGW for cross-compilation
        if: matrix.is_cross == true
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get Rust compiler version
        id: rust_version
        shell: bash
        run: echo "rust_version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build libSQL
        working-directory: libsql/bindings/c
        shell: bash
        run: |
          rm -f rust-toolchain.toml ../../rust-toolchain.toml

          if [ "${{ matrix.target }}" = "x86_64-pc-windows-gnu" ]; then
            perl -0pi -e 's/crate-type = \["cdylib",\s*"staticlib"\]/crate-type = ["staticlib"]/g' Cargo.toml
            perl -0pi -e 's@if let Some\(ref cc\) = cross_cc \{\n        if cc.contains\("aarch64"\) && cc.contains\("linux"\) \{\n            cmake_opts.push\(&cmake_toolchain_opt\);\n            writeln!\(toolchain_file, "set\(CMAKE_SYSTEM_NAME \\"Linux\\"\)"\)\.unwrap\(\);\n            writeln!\(toolchain_file, "set\(CMAKE_SYSTEM_PROCESSOR \\"arm64\\"\)"\)\.unwrap\(\);\n        }\n    \}@if let Some(ref cc) = cross_cc {\n        if cc.contains("aarch64") && cc.contains("linux") {\n            cmake_opts.push(&cmake_toolchain_opt);\n            writeln!(toolchain_file, "set(CMAKE_SYSTEM_NAME \\"Linux\\")").unwrap();\n            writeln!(toolchain_file, "set(CMAKE_SYSTEM_PROCESSOR \\"arm64\\")").unwrap();\n        }\n        if cc.contains("mingw32") {\n            cmake_opts.push(&cmake_toolchain_opt);\n            writeln!(toolchain_file, "set(CMAKE_SYSTEM_NAME \\"Windows\\")").unwrap();\n            writeln!(toolchain_file, "set(CMAKE_SYSTEM_PROCESSOR \\"x86_64\\")").unwrap();\n        }\n    }@s' ../../libsql-ffi/build.rs
            export CC_x86_64_pc_windows_gnu=x86_64-w64-mingw32-gcc
            export CXX_x86_64_pc_windows_gnu=x86_64-w64-mingw32-g++
            export AR_x86_64_pc_windows_gnu=x86_64-w64-mingw32-ar
            export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc
          fi

          LIBSQLITE3_FLAGS="-DSQLITE_ENABLE_COLUMN_METADATA" LIBSQL_BUNDLED=1 cargo build --release --target "${{ matrix.target }}"

      - name: Create shared library (Linux)
        if: matrix.ext == 'so'
        run: |
          cd libsql/target/${{ matrix.target }}/release
          ar -x libsql_experimental.a
          gcc -shared -o libsql.so *.o -lpthread -ldl -lm
          mkdir -p "${{ github.workspace }}/artifacts/${{ matrix.output }}/native"
          cp libsql.so "${{ github.workspace }}/artifacts/${{ matrix.output }}/native/"

      - name: Verify shared library (Linux)
        if: matrix.ext == 'so'
        run: |
          bash scripts/verify-linux-native-library.sh \
            "artifacts/${{ matrix.output }}/native/libsql.so" \
            "${{ matrix.elf_machine }}"

      - name: Create shared library (Windows)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: bash
        run: |
          cd libsql/target/${{ matrix.target }}/release

          ar -x libsql_experimental.a

          sqlite_lib="$(find ./build -name 'libsqlite3mc_static.a' -type f | head -n 1)"
          if [ -n "${sqlite_lib}" ]; then
            ar -x "${sqlite_lib}"
          fi

          if [ -f sqlite3mc.c.obj ]; then
            mv sqlite3mc.c.obj sqlite3mc.c.o
          fi

          x86_64-w64-mingw32-gcc -shared -o libsql.dll \
            -Wl,--whole-archive *.o -Wl,--no-whole-archive \
            -Wl,--export-all-symbols \
            -lws2_32 -ladvapi32 -luserenv -lbcrypt -lntdll -lcrypt32 \
            -lsecur32 -lkernel32 -lole32 -loleaut32 -luuid -lncrypt \
            -static-libgcc

          mkdir -p "${{ github.workspace }}/artifacts/${{ matrix.output }}/native"
          cp libsql.dll "${{ github.workspace }}/artifacts/${{ matrix.output }}/native/"

      - name: Create shared library (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd libsql/target/${{ matrix.target }}/release
          ar -x libsql_experimental.a
          clang -dynamiclib -o libsql.dylib *.o \
            -framework Security -framework CoreFoundation \
            -lSystem -lc -lm
          mkdir -p "${{ github.workspace }}/artifacts/${{ matrix.output }}/native"
          cp libsql.dylib "${{ github.workspace }}/artifacts/${{ matrix.output }}/native/"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libsql-${{ matrix.output }}
          path: artifacts/${{ matrix.output }}/native/libsql.${{ matrix.ext }}

      - name: Save version info
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          mkdir -p version-info
          echo "COMMIT_SHA=${{ steps.version_info.outputs.commit_sha }}" > version-info/version.env
          echo "TAG_NAME=${{ steps.version_info.outputs.tag_name }}" >> version-info/version.env
          echo "CARGO_VERSION=${{ steps.version_info.outputs.cargo_version }}" >> version-info/version.env
          echo "RUST_VERSION=${{ steps.rust_version.outputs.rust_version }}" >> version-info/version.env

      - name: Upload version info
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: version-info
          path: version-info/version.env

  commit-libraries:
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LIBSQL_REF: ${{ inputs.libsql_ref }}
      TARGET_BRANCH: ${{ inputs.target_branch != '' && inputs.target_branch || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch != '' && inputs.target_branch || github.ref_name }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Download version info artifact
        uses: actions/download-artifact@v8
        with:
          name: version-info
          path: version-info

      - name: Read version info
        id: read_version
        shell: bash
        run: |
          source version-info/version.env
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "cargo_version=${CARGO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "rust_version=${RUST_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Copy libraries to project
        shell: bash
        run: |
          mkdir -p src/Nelknet.LibSQL.Bindings/runtimes/linux-x64/native
          mkdir -p src/Nelknet.LibSQL.Bindings/runtimes/linux-arm64/native
          mkdir -p src/Nelknet.LibSQL.Bindings/runtimes/win-x64/native
          mkdir -p src/Nelknet.LibSQL.Bindings/runtimes/osx-arm64/native

          cp artifacts/libsql-linux-x64/libsql.so src/Nelknet.LibSQL.Bindings/runtimes/linux-x64/native/
          cp artifacts/libsql-linux-arm64/libsql.so src/Nelknet.LibSQL.Bindings/runtimes/linux-arm64/native/
          cp artifacts/libsql-win-x64/libsql.dll src/Nelknet.LibSQL.Bindings/runtimes/win-x64/native/
          cp artifacts/libsql-osx-arm64/libsql.dylib src/Nelknet.LibSQL.Bindings/runtimes/osx-arm64/native/

      - name: Write build information
        shell: bash
        env:
          LIBSQL_COMMIT: ${{ steps.read_version.outputs.commit_sha }}
          LIBSQL_TAG: ${{ steps.read_version.outputs.tag_name }}
          LIBSQL_CARGO_VERSION: ${{ steps.read_version.outputs.cargo_version }}
          RUST_COMPILER: ${{ steps.read_version.outputs.rust_version }}
          BUILD_WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/libsql-build-info.sh write \
            "$LIBSQL_REF" \
            "$LIBSQL_COMMIT" \
            "$LIBSQL_TAG" \
            "$LIBSQL_CARGO_VERSION" \
            "$RUST_COMPILER" \
            "$BUILD_WORKFLOW_RUN"

      - name: Generate libSQL badge metadata
        run: bash scripts/generate-libsql-badge.sh

      - name: Commit and push
        shell: bash
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add src/Nelknet.LibSQL.Bindings/runtimes/ .github/badges/libsql-version.json

          if git diff --cached --quiet; then
            echo "No native library changes to commit."
            exit 0
          fi

          reference_label="${{ steps.read_version.outputs.tag_name }}"
          if [ "${reference_label}" = "no-tag" ]; then
            reference_label="${LIBSQL_REF}"
          fi

          git commit -m "chore(native): update bundled libsql to ${reference_label}"
          git push origin "HEAD:${TARGET_BRANCH}"
