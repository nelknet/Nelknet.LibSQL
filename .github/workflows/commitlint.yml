name: Lint Commit Messages

on:
  pull_request:
    types: [opened, synchronize, edited]
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base branch to compare against when linting a branch directly'
        required: false
        default: 'main'
        type: string

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.3
      with:
        fetch-depth: 0

    - name: Skip Dependabot commits
      if: github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'dependabot[bot]' || startsWith(github.head_ref, 'dependabot/'))
      run: echo "Skipping commit message lint for Dependabot PRs"
    
    - name: Check commit messages
      if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.user.login != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/'))
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          BASE_REF="${{ inputs.base_ref }}"
        else
          BASE_REF="${{ github.base_ref }}"
        fi

        git fetch origin "$BASE_REF" --depth=1

        # Get all commits in the PR
        COMMITS=$(git log --format=%s "origin/${BASE_REF}..HEAD")

        # Conventional commit pattern
        PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z]+\))?: .{1,72}$'
        
        # Check each commit
        FAILED=0
        while IFS= read -r commit; do
          # Skip merge commits
          if [[ "$commit" =~ ^Merge ]]; then
            echo "⏭️  Skipping merge commit: $commit"
            continue
          fi
          
          if [[ ! "$commit" =~ $PATTERN ]]; then
            echo "❌ Invalid commit message: $commit"
            FAILED=1
          else
            echo "✅ Valid commit message: $commit"
          fi
        done <<< "$COMMITS"
        
        if [ $FAILED -eq 1 ]; then
          echo ""
          echo "Please use conventional commits format:"
          echo "  <type>(<scope>): <subject>"
          echo ""
          echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
          echo "Scopes: bindings, data, http, native, tests, examples, docs, deps, release, ci"
          echo ""
          echo "Example: feat(data): add support for custom SQL functions"
          exit 1
        fi
